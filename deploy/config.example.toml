# Spookhub configuration. Every key can be overridden by an environment variable:
# SPOOKHUB_<SECTION>__<KEY>, e.g. SPOOKHUB_MPV__VO=x11 or SPOOKHUB_SERVER__PORT=9000.

[server]
host = "0.0.0.0"
port = 8080
log_level = "info"
frontend_dir = "/opt/spookhub/frontend/dist"

[paths]
data_dir = "/var/lib/spookhub"   # database + uploaded media

[mpv]
enabled = true
binary = "mpv"
vo = "gpu"                 # dev desktop: "gpu" with gpu_context = "x11egl"/"wayland", tests: "null"
                           # keystone/mask/flip need "gpu-next" (warp shader); test it on the hub GPU first
gpu_context = "drm"        # no X/Wayland on the hub: render straight to KMS
hwdec = "auto-safe"
ao = "alsa"                # PipeWire needs a user session; ALSA works from a system service
extra_args = []            # e.g. ["--audio-device=alsa/hdmi:CARD=PCH,DEV=0", "--drm-connector=HDMI-A-1"]
socket_path = "/run/spookhub/mpv.sock"

[timing]
health_interval_s = 3.0
health_timeout_s = 1.5
degraded_latency_ms = 250.0
offline_after_failures = 3
cue_timeout_s = 0.3
command_timeout_s = 2.0
backoff_max_s = 15.0
scheduler_tick_s = 0.01
latency_comp_cap_ms = 150.0
scan_concurrency = 64
scan_timeout_s = 0.8
